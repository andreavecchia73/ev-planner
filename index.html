<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EV Planner</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>EV Planner</h1>
  </header>

  <main>
    <form id="trip" autocomplete="off">
      <fieldset>
        <legend>Viaggio</legend>
        <label>Partenza <input id="from" required placeholder="Es. Brescia, Italia" /></label>
        <label>Arrivo <input id="to" required placeholder="Es. Torino, Italia" /></label>
      </fieldset>

      <fieldset>
        <legend>Veicolo (i valori sono esempi: sostituiscili con i tuoi)</legend>
        <label>Batteria utile (kWh) <input id="batteryKwh" type="number" step="any" min="1" /></label>
        <label>Consumo misurato (kWh/100 km) <input id="consumptionKwh100" type="number" step="any" min="1" /></label>
        <label>Potenza DC massima (kW) <input id="maxDcKw" type="number" step="any" min="1" /></label>
      </fieldset>

      <fieldset>
        <legend>Condizioni e soglie</legend>
        <label>SoC di partenza (%) <input id="startPct" type="number" min="0" max="100" /></label>
        <label>SoC minimo all'arrivo (%) <input id="arriveMinPct" type="number" min="0" max="100" /></label>
        <label>Riserva di sicurezza (%) <input id="reservePct" type="number" min="0" max="100" /></label>
        <label>Ricarica fino a (%) <input id="chargeToPct" type="number" min="0" max="100" /></label>
        <label>Temperatura media (°C) <input id="tempC" type="number" step="any" /></label>
        <label>Velocità media (km/h) <input id="avgKmh" type="number" min="1" /></label>
      </fieldset>

      <fieldset>
        <legend>Chiave API OpenChargeMap (facoltativa)</legend>
        <label>Chiave <input id="ocmKey" type="password" /></label>
      </fieldset>

      <button id="plan" type="submit">Pianifica viaggio</button>
      <p id="status" role="status"></p>
    </form>

    <button id="startNav" type="button" hidden>Avvia navigazione</button>

    <section id="result" hidden>
      <h2>Risultato</h2>
      <dl id="summary"></dl>
      <h3>Soste di ricarica</h3>
      <ol id="stops"></ol>
    </section>

    <div id="map"></div>
    <p class="attribution">Colonnine: <a href="https://openchargemap.org/">OpenChargeMap</a> contributors, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Mappa: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.</p>
  </main>

  <section id="nav" aria-live="polite" hidden>
    <p id="nav-next" class="nav-next">—</p>
    <p id="nav-dist" class="nav-sub"></p>
    <dl id="nav-dash"></dl>
    <p id="nav-warn" class="warn" role="alert"></p>
    <label class="soc">Batteria (stima, trascina per correggere): <output id="navPctOut">—</output>
      <input id="navPct" type="range" min="0" max="100" step="1" />
    </label>
    <div class="nav-buttons">
      <button id="recenter" type="button">Vista libera</button>
      <button id="recalc" type="button">Ricalcola da qui</button>
      <button id="stopNav" type="button">Termina</button>
    </div>
    <p id="nav-gps" class="attribution"></p>
  </section>

  <div id="nav-arrow" hidden>
    <svg viewBox="0 0 40 40" width="44" height="44" aria-hidden="true">
      <path d="M20 3 L35 36 L20 28 L5 36 Z" fill="#1a73e8" stroke="#fff" stroke-width="3" stroke-linejoin="round" />
    </svg>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
